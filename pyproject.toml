[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-diagnostic-intelligence"
version = "0.1.0"
description = "Deterministic-first, evidence-based Windows diagnostic intelligence"
requires-python = ">=3.11"
dependencies = [
	"pydantic>=2.7,<3",
	"psutil>=5.9,<8",
	"fastapi>=0.115,<1",
	"uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["diagnostic_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
